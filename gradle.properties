# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric (check https://fabricmc.net/develop )
# Development versions (for building; mod is compatible with MC 26.1.x series)
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.16-SNAPSHOT

# Mod
mod_version=1.4.0
maven_group=com.litestock

# Dependencies
# Development version (for building; mod is compatible with all Fabric API for 26.1.x)
fabric_api_version=0.152.1+26.1.2
# Litematica + MaLiLib are provided as local jars in libs/ (not on a public maven).
# Runtime compatibility:
#   Minecraft: 26.1.x (all minor versions)
#   Fabric Loader: >= 0.18.0
#   Fabric API: any 26.1.x version
#   MaLiLib: >= 0.28.0 (26.1-x series)
#   Litematica: >= 0.27.0 (26.1-x series)
# Reference versions used for building:
#   litematica-fabric-26.1.2-0.27.10.jar
#   malilib-fabric-26.1.2-0.28.8.jar
