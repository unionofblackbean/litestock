plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def versions = [
    '26.1'  : [fabricApi: '0.155.3+26.1.2', litematica: '0.27.14', malilib: '0.28.12'],
    '26.1.1': [fabricApi: '0.155.3+26.1.2', litematica: '0.27.14', malilib: '0.28.12'],
    '26.1.2': [fabricApi: '0.155.3+26.1.2', litematica: '0.27.14', malilib: '0.28.12'],
    '26.2'  : [fabricApi: '0.161.0+26.2', litematica: '0.28.8', malilib: '0.29.6'],
    '26.3'  : [fabricApi: '0.166.2+26.3', litematica: '0.29.1', malilib: '0.30.2']
]
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def target = versions[minecraftVersion]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version ${minecraftVersion}. Choose one of: ${versions.keySet().join(', ')}")
}

base {
    archivesName = "litestock-mc${minecraftVersion}"
}
layout.buildDirectory.set(layout.projectDirectory.dir("build/${minecraftVersion}"))

def renderVersion = minecraftVersion.startsWith('26.1') ? '26.1' : minecraftVersion
sourceSets.main.java.srcDir "src/mc${renderVersion}/java"
if (renderVersion != '26.1') {
    sourceSets.main.java.srcDir 'src/modern-rendering/java'
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    mods {
        "litestock" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client { runDir "run/${minecraftVersion}" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
    implementation "maven.modrinth:litematica:${target.litematica}"
    implementation "maven.modrinth:malilib:${target.malilib}"
}

processResources {
    def properties = [
        version: project.version,
        minecraft: minecraftVersion,
        loader: project.loader_version,
        litematica: target.litematica,
        malilib: target.malilib
    ]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}
